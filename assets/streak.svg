  <text x="191" y="215" text-anchor="middle" fill="#fdba74" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".7">🔥 KEEP IT GOING</text>

  <rect x="303" y="91" width="269" height="142" rx="18" fill="#111a31" stroke="#303957"/>
